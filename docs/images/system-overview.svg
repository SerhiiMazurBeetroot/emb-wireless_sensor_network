<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="600" y="32" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Wireless Sensor Network — system overview</text>

<!-- Node 1 -->
<rect x="40" y="60" width="340" height="210" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
<text x="210" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#0C447C">Sensor Node 1</text>
<rect x="60" y="112" width="130" height="56" rx="8" fill="#fff" stroke="#85B7EB" stroke-width="1.5"/>
<text x="125" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">BME280</text>
<text x="125" y="156" text-anchor="middle" font-size="13" fill="#555">SPI1</text>
<rect x="230" y="112" width="130" height="56" rx="8" fill="#fff" stroke="#85B7EB" stroke-width="1.5"/>
<text x="295" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">STM32F401</text>
<text x="295" y="156" text-anchor="middle" font-size="13" fill="#555">SPI2 → nRF24L01+</text>
<line x1="190" y1="140" x2="228" y2="140" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="205" text-anchor="middle" font-size="14" fill="#333">18650 → TP4056 → HT7333 → 3.3 V</text>
<text x="210" y="235" text-anchor="middle" font-size="13" fill="#555">Active · Light sleep · Deep sleep (STOP)</text>

<!-- Node 2 -->
<rect x="40" y="330" width="340" height="210" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
<text x="210" y="362" text-anchor="middle" font-size="20" font-weight="bold" fill="#0C447C">Sensor Node 2</text>
<rect x="60" y="382" width="130" height="56" rx="8" fill="#fff" stroke="#85B7EB" stroke-width="1.5"/>
<text x="125" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">AHT20</text>
<text x="125" y="426" text-anchor="middle" font-size="13" fill="#555">I²C1</text>
<rect x="230" y="382" width="130" height="56" rx="8" fill="#fff" stroke="#85B7EB" stroke-width="1.5"/>
<text x="295" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">STM32F401</text>
<text x="295" y="426" text-anchor="middle" font-size="13" fill="#555">SPI2 → nRF24L01+</text>
<line x1="190" y1="410" x2="228" y2="410" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<text x="210" y="475" text-anchor="middle" font-size="14" fill="#333">18650 → TP4056 → HT7333 → 3.3 V</text>
<text x="210" y="505" text-anchor="middle" font-size="13" fill="#555">Active · Light sleep · Deep sleep (STOP)</text>

<!-- Radio link -->
<rect x="470" y="215" width="260" height="170" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="2"/>
<text x="600" y="246" text-anchor="middle" font-size="18" font-weight="bold" fill="#3C3489">nRF24L01+ radio link</text>
<text x="600" y="278" text-anchor="middle" font-size="14" fill="#333">2.4 GHz · channel 76</text>
<text x="600" y="304" text-anchor="middle" font-size="14" fill="#333">DATA ⇄ ACK (application level)</text>
<text x="600" y="330" text-anchor="middle" font-size="14" fill="#333">CRC-8 · sequence numbers</text>
<text x="600" y="356" text-anchor="middle" font-size="14" fill="#333">≤ 3 attempts · 200 ms timeout</text>

<line x1="382" y1="165" x2="468" y2="268" stroke="#444" stroke-width="2.2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="382" y1="435" x2="468" y2="332" stroke="#444" stroke-width="2.2" marker-start="url(#a)" marker-end="url(#a)"/>

<!-- Gateway -->
<rect x="830" y="60" width="330" height="480" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
<text x="995" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#085041">Gateway</text>
<rect x="870" y="110" width="250" height="70" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="1.5"/>
<text x="995" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">OLED display</text>
<text x="995" y="160" text-anchor="middle" font-size="13" fill="#555">I²C 0x3C · link statistics</text>
<rect x="870" y="250" width="250" height="100" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="1.5"/>
<text x="995" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ESP32-S3</text>
<text x="995" y="306" text-anchor="middle" font-size="13" fill="#555">ESP-IDF · FreeRTOS</text>
<text x="995" y="328" text-anchor="middle" font-size="13" fill="#555">nRF24L01+ (IRQ-driven RX)</text>
<rect x="870" y="420" width="250" height="90" rx="8" fill="#fff" stroke="#5DCAA5" stroke-width="1.5"/>
<text x="995" y="446" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Web monitoring</text>
<text x="995" y="468" text-anchor="middle" font-size="13" fill="#555">Wi-Fi SoftAP · CSV export</text>
<text x="995" y="490" text-anchor="middle" font-size="13" fill="#555">http://192.168.4.1</text>
<line x1="995" y1="250" x2="995" y2="182" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
<line x1="995" y1="350" x2="995" y2="418" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

<text x="600" y="578" text-anchor="middle" font-size="13" fill="#777">Star topology: two battery-powered nodes and one gateway</text>
<line x1="732" y1="300" x2="868" y2="300" stroke="#444" stroke-width="2.2" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
