<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WSN Gateway</title>
<link rel="stylesheet" href="web_page.css">
</head>
<body class="pane-charts">
<header>
  <div>
    <h1>WSN Gateway</h1>
    <div class="sub" id="status">Commanded mode: Deep sleep</div>
  </div>
  <div class="row page-tools">
    <a class="btn" id="export" href="/api/export.csv">Export CSV</a>
    <button type="button" class="demo" id="demo">Demo</button>
    <button type="button" class="term-btn on" id="term-toggle">Terminal</button>
  </div>
</header>
<main>
  <nav class="tabs" id="tabs">
    <button class="tab on" type="button" data-pane="charts">Charts</button>
    <button class="tab" type="button" data-pane="log">Terminal</button>
  </nav>
  <div class="layout">
  <div class="charts">
  <div class="chart-bar">
    <div class="row">
      <button data-mode="0" type="button">Active</button>
      <button data-mode="1" type="button">Light sleep</button>
      <button data-mode="2" type="button">Deep sleep</button>
    </div>
  </div>
  <div class="nodes" id="nodes"><p class="note">Waiting for samples</p></div>
  <div class="chart-bar picks" id="chart-picks">
    <div class="row">

    <button type="button" class="pick on" data-chart="iv">Current</button>
    <button type="button" class="pick on" data-chart="temp">Temperature</button>
    <button type="button" class="pick on" data-chart="press">Pressure</button>
    <button type="button" class="pick on" data-chart="hum">Humidity</button>
  </div>
  </div>
  <div class="chart-bar picks">
    <div class="row" id="span-picks">
      <button type="button" class="span" data-span="60">1 min</button>
      <button type="button" class="span on" data-span="300">5 min</button>
      <button type="button" class="span" data-span="900">15 min</button>
      <button type="button" class="span" data-span="3600">60 min</button>
      <button type="button" class="span" data-span="0">All</button>
    </div>
  </div>
  <div class="grid">
    <section class="card" data-chart="iv">
      <h2><span>Current, mA</span><span>voltage, V</span></h2>
      <canvas id="iv"></canvas>
      <div class="legend">
        <div class="row">
          <span><i class="sw line" style="background:#08F7FE; box-shadow:0 0 6px #08F7FE"></i>Node 1</span>
          <span><i class="sw line" style="background:#FE53BB; box-shadow:0 0 6px #FE53BB"></i>Node 2</span>
        </div>
        <div class="row">
          <span><i class="sw" style="background:#08F7FE; box-shadow:0 0 6px #08F7FE"></i>Active</span>
          <span><i class="sw" style="background:#F5D300; box-shadow:0 0 6px #F5D300"></i>Light sleep</span>
          <span><i class="sw" style="background:#00ff9f; box-shadow:0 0 6px #00ff9f"></i>Deep sleep</span>
        </div>
      </div>
    </section>
    <section class="card" data-chart="temp">
      <h2>Temperature, C</h2>
      <canvas id="temp"></canvas>
      <div class="legend">
        <span><i class="sw line" style="background:#08F7FE; box-shadow:0 0 6px #08F7FE"></i>Node 1</span>
        <span><i class="sw line" style="background:#FE53BB; box-shadow:0 0 6px #FE53BB"></i>Node 2</span>
      </div>
    </section>
    <section class="card" data-chart="press">
      <h2>Pressure, hPa</h2>
      <canvas id="press"></canvas>
      <div class="legend">
        <span><i class="sw line" style="background:#08F7FE; box-shadow:0 0 6px #08F7FE"></i>Node 1</span>
        <span><i class="sw line" style="background:#FE53BB; box-shadow:0 0 6px #FE53BB"></i>Node 2</span>
      </div>
    </section>
    <section class="card" data-chart="hum">
      <h2>Humidity, %</h2>
      <canvas id="hum"></canvas>
      <div class="legend">
        <span><i class="sw line" style="background:#08F7FE; box-shadow:0 0 6px #08F7FE"></i>Node 1</span>
        <span><i class="sw line" style="background:#FE53BB; box-shadow:0 0 6px #FE53BB"></i>Node 2</span>
      </div>
    </section>
  </div>
  </div>
  <aside class="card side">
    <div class="term-bar">
      <h2>Terminal</h2>
      <button class="ghost" id="log-clear" type="button">Clear</button>
    </div>
    <div id="term" class="term"></div>
  </aside>
  </div>
</main>
<script src="web_page.js"></script>
</body>
</html>
